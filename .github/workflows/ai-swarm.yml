name: ai-swarm

# Phase 4 — event-driven half of the MES Agent Swarm.
#
# Mirrors the label state machine owned locally by scripts/agent-dispatcher.ps1:
#   issue[ai:implement] -> implement -> PR[ai:review] -> review -> PR[ai:verify]
#   -> verify -> PR[ai:e2e] -> e2e -> PR[ai:ready] -> merge (squash, automatic)
#   any failure verdict -> PR[ai:changes] -> fix -> PR[ai:review]
#   docs-only PRs: review APPROVED -> PR[ai:ready] (verify/e2e skipped)
#
# Throughput: at most MAX_PARALLEL (default 3) items hold ai:running at once;
# the sweep job re-fires queued ai:implement issues on push-to-default and
# every 30 min, so refused work retries instead of stalling.
#
# The local dispatcher stays as fallback/debug; both sides honor ai:running
# as the cross-runner lock and ai:blocked as the human-escalation state.
#
# Required secret: OPENCODE_API_KEY (opencode.ai/auth) — without it every
# agent job fails fast with a clear message. GITHUB_TOKEN is automatic.
# CI runners are isolated clones, so agents run with opencode --auto
# (permission files still deny pushes to the default branch).

on:
  issues:
    types: [labeled]
  pull_request_target:
    types: [labeled, synchronize]
  workflow_run:
    workflows: [ci]
    types: [completed]
  push:
    branches: [master, main] # sweep wake-up after every merge
  schedule:
    - cron: '0 6 * * 1' # researcher: Mondays 06:00 UTC
    - cron: '30 5 * * *' # tracker: daily 05:30 UTC
    - cron: '*/30 * * * *' # sweep: re-fire queued ai:implement when a slot is free
  workflow_dispatch:
    inputs:
      agent:
        description: 'Agent to run'
        required: true
        type: choice
        options: [mes-implementer, mes-reviewer, mes-verifier, mes-e2e-tester, mes-researcher, mes-tracker]
      number:
        description: 'Issue or PR number (not needed for researcher/tracker)'
        required: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  checks: read
  actions: write # approve bot-triggered ci runs stuck in action_required

# Label name is part of the group so ai:review and ai:verify can run together.
# Same label on the same item still queues (cancel-in-progress: false).
concurrency:
  group: ai-swarm-${{ github.event.issue.number || github.event.pull_request.number || inputs.number || github.event.workflow_run.head_sha || github.run_id }}-${{ github.event.label.name || github.event_name }}
  cancel-in-progress: false

env:
  # 0 = unlimited: review/fix rounds run until the PR is green, no round cap.
  MAX_ROUNDS: '0'
  MAX_PARALLEL: '3'
  BACKLOG_MAX: '5'
  QUEUE_TARGET: '2'
  STALE_LOCK_MINUTES: '45'
  # Prefer a user PAT so bot-opened PRs are authored by a collaborator and skip
  # the public-repo approval gate (without it every bot PR stalls on approve,
  # and approved runs do not emit workflow_run events). Falls back to the
  # automatic token when the secret is absent.
  GH_TOKEN: ${{ secrets.SWARM_PAT || secrets.GITHUB_TOKEN }}
  # Approve action_required ci runs. SWARM_PAT has no Actions scope; this token
  # does (permissions.actions: write). Do not point gh itself at it.
  ACTIONS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}

jobs:
  # ---------------------------------------------------------------- implement
  implement:
    name: implement issue
    if: >
      github.event_name == 'issues' &&
      github.event.label.name == 'ai:implement' ||
      github.event_name == 'workflow_dispatch' &&
      inputs.agent == 'mes-implementer'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # fetch-depth 0: agents merge master into their branches — a shallow
      # clone hides the merge base and git invents bogus conflicts.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - uses: ./.github/actions/setup-opencode
      - name: Implement and open PR
        run: |
          # shellcheck disable=SC1091
          source scripts/ci/swarm-lib.sh
          ISSUE='${{ github.event.issue.number || inputs.number }}'
          if [ -z "$ISSUE" ]; then
            echo '::error::No issue number resolved from the event.'
            exit 1
          fi
          swarm_require_auth
          if [ "$(swarm_in_flight_count)" -ge "${MAX_PARALLEL:-3}" ]; then
            echo "at capacity ($(swarm_in_flight_count) in flight >= ${MAX_PARALLEL:-3}); leaving ai:implement for the sweeper"
            exit 0
          fi
          # Serialize EF-migration work: parallel migrations zipper-merge into
          # DefaultContextModelSnapshot.cs and corrupt master. The sweeper
          # re-fires this issue once the in-flight migration PR lands.
          MIG_PR=$(swarm_in_flight_migration_pr)
          if [ -n "$MIG_PR" ]; then
            echo "migration PR #$MIG_PR in flight; deferring issue #$ISSUE for the sweeper"
            exit 0
          fi
          # Lost race for the lock: exit green — the holder does the work.
          # (A lock with no live run behind it is cleared by the stale-lock sweep.)
          swarm_acquire_lock issue "$ISSUE" || { echo 'lock held by another runner; exiting green'; exit 0; }
          swarm_auto_release issue "$ISSUE"
          git config user.name 'MES Agent Swarm'
          git config user.email 'mes-swarm@users.noreply.github.com'
          swarm_use_pat_remote "${{ secrets.SWARM_PAT }}"
          swarm_run_agent mes-implementer \
            "Implement GitHub issue #$ISSUE. Read it with 'gh issue view $ISSUE --comments'. Follow AGENT.md and the area instructions. Write unit tests AND endpoint integration tests, but only RUN 'dotnet build AsistOff.MES.sln', 'dotnet test tests/AsistOff.MES.Shared.Tests' and 'npm --prefix AsistOff.MES.Web run build'. Do NOT run tests/AsistOff.MES.Integration.Tests and do NOT start the application, any database or docker (CI runs integration tests; Playwright e2e is a later stage). Push branch ai/issue-$ISSUE-<slug> and open a PR that closes #$ISSUE. Keep the branch current with master: before the final push run 'git fetch origin master && git merge origin/master' and resolve any conflicts (never leave conflict markers; never hand-merge Migrations/DefaultContextModelSnapshot.cs — regenerate the migration with 'dotnet ef migrations remove/add --project AsistOff.MES.Shared.Infrastructure --startup-project AsistOff.MES.Gateway --context DefaultContext'; in i18n.ts, sitemap.ts and ApiContracts.cs keep the union of both sides). Do not add or remove ai:* labels." \
            implement.log
          BRANCH=$(swarm_branch_for_issue "$ISSUE")
          if [ -n "$BRANCH" ]; then
            git fetch origin "$BRANCH"
            git checkout -B "$BRANCH" "origin/$BRANCH"
            # Deterministic re-sync: the agent may have branched from a stale
            # master (long run) — conflicts here are handed back to the agent.
            MERGE_RC=0
            swarm_sync_master || MERGE_RC=$?
            if [ "$MERGE_RC" = 2 ]; then
              swarm_run_agent mes-implementer \
                "Resolve the in-progress merge of master into $BRANCH. $(swarm_conflict_rules)" \
                implement-merge.log
            fi
            if ! swarm_finish_merge_if_pending; then
              swarm_remove_label issue "$ISSUE" ai:implement
              swarm_add_label issue "$ISSUE" ai:blocked
              swarm_say issue "$ISSUE" 'Agent flow (CI): merge with master left unresolved conflicts after the fix round. Needs human attention.'
              exit 1
            fi
            if ! swarm_check_conflict_markers; then
              swarm_run_agent mes-implementer \
                'Remove every merge-conflict marker from the working tree (they were committed by mistake). Resolve each file to the correct final content — union both sides for i18n.ts/sitemap.ts/ApiContracts.cs — then run the builds and push.' \
                implement-markers.log
              if ! swarm_check_conflict_markers; then
                swarm_remove_label issue "$ISSUE" ai:implement
                swarm_add_label issue "$ISSUE" ai:blocked
                swarm_say issue "$ISSUE" 'Agent flow (CI): conflict markers survived the cleanup round. Needs human attention.'
                exit 1
              fi
            fi
            git push origin "$BRANCH" || true
          fi
          PR=$(swarm_find_pr_for_issue "$ISSUE")
          if [ -z "$PR" ]; then
            # Fallback: agent pushed the branch but did not open the PR
            # (e.g. missing repo permission) — open it deterministically.
            if [ -n "$BRANCH" ]; then
              TITLE=$(gh issue view "$ISSUE" --json title --jq .title)
              BODY=$(mktemp)
              {
                echo "Closes #$ISSUE. Opened by CI fallback: the branch was pushed but no PR existed."
                echo 'See the issue comments for the implementer verification report.'
              } >"$BODY"
              if PR=$(swarm_open_pr "$BRANCH" "$TITLE" "$BODY"); then
                echo "fallback opened PR #$PR"
              else
                CODE=$?
                rm -f "$BODY"
                swarm_remove_label issue "$ISSUE" ai:implement
                swarm_add_label issue "$ISSUE" ai:blocked
                if [ "$CODE" = 3 ]; then
                  NOTE=$(mktemp)
                  swarm_pr_permission_note >"$NOTE"
                  swarm_comment issue "$ISSUE" "$NOTE"
                  rm -f "$NOTE"
                else
                  swarm_say issue "$ISSUE" 'Agent flow (CI): branch exists but the PR could not be opened. Needs human attention.'
                fi
                exit 1
              fi
              rm -f "$BODY"
            else
              # No branch at all: a starved/crashed agent session. Retry once
              # via the sweeper before escalating to a human.
              TRIES=$(swarm_comments_body issue "$ISSUE" | grep -c 'implementer produced no branch' || true)
              if [ "$TRIES" -lt 2 ]; then
                swarm_say issue "$ISSUE" "Agent flow (CI): implementer produced no branch (attempt $((TRIES+1))/2). Keeping ai:implement — the sweeper will retry."
                exit 0
              fi
              swarm_remove_label issue "$ISSUE" ai:implement
              swarm_add_label issue "$ISSUE" ai:blocked
              swarm_say issue "$ISSUE" 'Agent flow (CI): implementer produced no branch after 2 attempts. Needs human attention.'
              exit 1
            fi
          fi
          if [ "$(gh pr view "$PR" --json isDraft --jq .isDraft)" = true ]; then
            gh pr ready "$PR" >/dev/null
          fi
          swarm_remove_label issue "$ISSUE" ai:implement
          swarm_open_gates "$PR"
          echo "PR #$PR gates opened"

  # -------------------------------------------------------------------- review
  review:
    name: review PR
    # NOTE: no parentheses in GitHub expressions; && binds tighter than ||.
    # workflow_run fires on ci success AND failure: a red ci must send the PR
    # back to ai:changes (before this, a red CI after a wait-timeout deadlocked
    # the PR in ai:review forever).
    if: >
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.draft == false &&
      github.event.label.name == 'ai:review' ||
      github.event_name == 'pull_request_target' &&
      github.event.action == 'synchronize' &&
      contains(github.event.pull_request.labels.*.name, 'ai:review') ||
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' ||
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'failure' ||
      github.event_name == 'workflow_dispatch' &&
      inputs.agent == 'mes-reviewer'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # Checkout first: the resolve step needs scripts/ci/swarm-lib.sh,
      # which only exists after checkout (no automatic checkout on
      # workflow_run events). PR merge ref is checked out after resolving.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Resolve PR number
        id: pr
        run: |
          # shellcheck disable=SC1091
          source scripts/ci/swarm-lib.sh
          swarm_stage_lib
          PR=''
          if [ '${{ github.event_name }}' = workflow_run ]; then
            PR=$(swarm_pr_for_sha '${{ github.event.workflow_run.head_sha }}')
            if [ -z "$PR" ] || ! swarm_has_label pr "$PR" ai:review; then
              echo 'No open PR with ai:review for this CI run; nothing to do.'
              echo "skip=true" >>"$GITHUB_OUTPUT"
              PR=''
            else
              echo "number=$PR" >>"$GITHUB_OUTPUT"
            fi
          elif [ '${{ github.event_name }}' = workflow_dispatch ]; then
            PR='${{ inputs.number }}'
            echo "number=$PR" >>"$GITHUB_OUTPUT"
          else
            PR='${{ github.event.pull_request.number }}'
            echo "number=$PR" >>"$GITHUB_OUTPUT"
          fi
          if [ -n "$PR" ] && [ "$(swarm_pr_mergeable "$PR")" = CONFLICTING ]; then
            # refs/pull/N/merge does not exist while the PR conflicts — route
            # to the fixer instead of failing the checkout below.
            swarm_remove_label pr "$PR" ai:review
            swarm_refire_label pr "$PR" ai:changes
            swarm_say pr "$PR" 'Agent flow (CI): the PR conflicts with master — back to ai:changes so the fixer can rebase and resolve.'
            echo "skip=true" >>"$GITHUB_OUTPUT"
          elif [ -n "$PR" ] && swarm_verdict_covers_head "$PR" review APPROVED; then
            state=$(swarm_ci_state_once "$PR")
            if [ "$state" = pass ] || [ "$state" = none ]; then
              echo 'APPROVED covers this head SHA and CI is green; skipping reviewer'
              swarm_after_review_approved "$PR"
              echo "skip=true" >>"$GITHUB_OUTPUT"
            fi
          fi
      - uses: actions/checkout@v6
        if: steps.pr.outputs.skip != 'true'
        with:
          repository: ${{ github.repository }}
          ref: refs/pull/${{ steps.pr.outputs.number }}/merge
      - uses: ./.github/actions/setup-opencode
        if: steps.pr.outputs.skip != 'true'
      - name: Wait for CI, then review
        if: steps.pr.outputs.skip != 'true'
        run: |
          # shellcheck disable=SC1091
          source "$RUNNER_TEMP/swarm-lib.sh"
          PR='${{ steps.pr.outputs.number }}'
          swarm_require_auth
          if [ '${{ github.event.pull_request.draft }}' = true ]; then
            echo 'Draft PR; skipping.'
            exit 0
          fi
          # Read-only stage: do not take ai:running. That lock is for mutating
          # jobs and used to burn a MAX_PARALLEL slot during the CI wait, and
          # it blocked the parallel verify job.
          CI=$(swarm_wait_ci "$PR" 600 | tail -n 1)
          echo "ci=$CI"
          case "$CI" in
            fail)
              swarm_remove_label pr "$PR" ai:review
              swarm_remove_label pr "$PR" ai:verify
              swarm_refire_label pr "$PR" ai:changes
              swarm_say pr "$PR" 'Agent flow (CI): CI is red — implementer will fix (see failing checks).'
              exit 0
              ;;
            approval)
              swarm_block_for_approval "$PR" ai:review
              exit 0
              ;;
            timeout)
              swarm_say pr "$PR" 'Agent flow (CI): CI was still pending after 10m; keeping ai:review. The ci-completed event will retrigger this job.'
              exit 0
              ;;
            pass) ;;
            *)
              swarm_say pr "$PR" "Agent flow (CI): unexpected CI state '$CI'; keeping ai:review."
              exit 0
              ;;
          esac
          if swarm_verdict_covers_head "$PR" review APPROVED; then
            echo 'APPROVED already covers this head SHA; skipping reviewer'
            swarm_after_review_approved "$PR"
            exit 0
          fi
          # Judge the head we are about to read, and pin the verdict to it below.
          SHA=$(gh pr view "$PR" --json headRefOid --jq .headRefOid)
          swarm_run_agent mes-reviewer \
            "Review PR #$PR for AsistOff MES. Inspect only the diff with 'gh pr diff $PR'. Post your findings with 'gh pr comment $PR' and end the body with exactly one verdict on its own line: 'VERDICT: APPROVED' or 'VERDICT: CHANGES_REQUESTED'. Do not write any other VERDICT line. Do not add or remove ai:* labels." \
            review.log
          VERDICT=$(swarm_verdict 'APPROVED|CHANGES_REQUESTED' review.log)
          if [ "$VERDICT" = UNKNOWN ] || [ "$VERDICT" = AMBIGUOUS ]; then
            VERDICT=$(swarm_comments_body pr "$PR" | swarm_last_verdict_stdin 'APPROVED|CHANGES_REQUESTED')
          fi
          # Pin the verdict to the reviewed SHA so a re-fired label can skip the
          # agent instead of re-judging an identical diff (swarm_verdict_covers_head).
          # '|| true': a push during the pass leaves a stale SHA, and the mark is
          # only an optimisation - it must never abort the step before the
          # label transition below (bash -e would skip it).
          case "$VERDICT" in
            APPROVED | CHANGES_REQUESTED) swarm_mark_verdict "$PR" review "$SHA" "$VERDICT" || true ;;
          esac
          case "$VERDICT" in
            APPROVED) swarm_after_review_approved "$PR" ;;
            CHANGES_REQUESTED)
              swarm_remove_label pr "$PR" ai:review
              swarm_remove_label pr "$PR" ai:verify
              swarm_refire_label pr "$PR" ai:changes
              echo '-> ai:changes'
              ;;
            *)
              swarm_remove_label pr "$PR" ai:review
              swarm_add_label pr "$PR" ai:blocked
              swarm_say pr "$PR" 'Agent flow (CI): reviewer produced no unambiguous verdict. Needs human attention.'
              exit 1
              ;;
          esac

  # -------------------------------------------------------------------- verify
  verify:
    name: verify PR tests
    if: >
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.draft == false &&
      github.event.label.name == 'ai:verify' ||
      github.event_name == 'workflow_dispatch' &&
      inputs.agent == 'mes-verifier'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Resolve PR number
        id: pr
        run: |
          # shellcheck disable=SC1091
          source scripts/ci/swarm-lib.sh
          swarm_stage_lib
          PR='${{ github.event.pull_request.number || inputs.number }}'
          echo "number=$PR" >>"$GITHUB_OUTPUT"
          if [ "$(swarm_pr_mergeable "$PR")" = CONFLICTING ]; then
            swarm_remove_label pr "$PR" ai:verify
            swarm_refire_label pr "$PR" ai:changes
            swarm_say pr "$PR" 'Agent flow (CI): the PR conflicts with master — back to ai:changes so the fixer can rebase and resolve.'
            echo "skip=true" >>"$GITHUB_OUTPUT"
          elif swarm_verdict_covers_head "$PR" verify TESTS_SOUND; then
            echo 'TESTS_SOUND covers this head SHA; skipping verifier'
            swarm_after_verify_sound "$PR"
            echo "skip=true" >>"$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v6
        if: steps.pr.outputs.skip != 'true'
        with:
          repository: ${{ github.repository }}
          ref: refs/pull/${{ steps.pr.outputs.number }}/merge
      - uses: actions/setup-dotnet@v5
        if: steps.pr.outputs.skip != 'true'
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v6
        if: steps.pr.outputs.skip != 'true'
        with:
          node-version: 20
      - uses: ./.github/actions/setup-opencode
        if: steps.pr.outputs.skip != 'true'
      - name: Cache NuGet packages
        if: steps.pr.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Verify tests prove the acceptance criteria
        if: steps.pr.outputs.skip != 'true'
        run: |
          # shellcheck disable=SC1091
          source "$RUNNER_TEMP/swarm-lib.sh"
          PR='${{ steps.pr.outputs.number }}'
          swarm_require_auth
          if swarm_verdict_covers_head "$PR" verify TESTS_SOUND; then
            echo 'TESTS_SOUND already covers this head SHA; skipping verifier'
            swarm_after_verify_sound "$PR"
            exit 0
          fi
          SHA=$(gh pr view "$PR" --json headRefOid --jq .headRefOid)
          swarm_run_agent mes-verifier \
            "Verify that the tests in PR #$PR genuinely prove the acceptance criteria. Read-only audit: inspect the diff with 'gh pr diff $PR', map each criterion to the test(s) that prove it, check for weakened tests. DO NOT write files, commit, or push. Post the report with 'gh pr comment $PR' ending with exactly one verdict on its own line: 'VERDICT: TESTS_SOUND' or 'VERDICT: TESTS_INSUFFICIENT'. Do not write any other VERDICT line. Do not add or remove ai:* labels." \
            verify.log
          VERDICT=$(swarm_verdict 'TESTS_SOUND|TESTS_INSUFFICIENT' verify.log)
          if [ "$VERDICT" = UNKNOWN ] || [ "$VERDICT" = AMBIGUOUS ]; then
            VERDICT=$(swarm_comments_body pr "$PR" | swarm_last_verdict_stdin 'TESTS_SOUND|TESTS_INSUFFICIENT')
          fi
          case "$VERDICT" in
            TESTS_SOUND | TESTS_INSUFFICIENT) swarm_mark_verdict "$PR" verify "$SHA" "$VERDICT" || true ;;
          esac
          case "$VERDICT" in
            TESTS_SOUND) swarm_after_verify_sound "$PR" ;;
            TESTS_INSUFFICIENT)
              swarm_remove_label pr "$PR" ai:verify
              swarm_remove_label pr "$PR" ai:review
              swarm_refire_label pr "$PR" ai:changes
              swarm_say pr "$PR" 'Agent flow (CI): verifier found untested criteria or weakened tests (see verification report). Implementer must add real tests.'
              ;;
            *)
              swarm_remove_label pr "$PR" ai:verify
              swarm_add_label pr "$PR" ai:blocked
              swarm_say pr "$PR" 'Agent flow (CI): verifier produced no unambiguous verdict. Needs human attention.'
              exit 1
              ;;
          esac

  # ------------------------------------------------------------------------ fix
  fix:
    name: fix PR from feedback
    if: >
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.draft == false &&
      github.event.label.name == 'ai:changes' ||
      github.event_name == 'workflow_dispatch' &&
      inputs.agent == 'mes-implementer' &&
      inputs.number != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # The fix job checks out the PR HEAD BRANCH, never refs/pull/N/merge:
      # the merge ref does not exist while the PR conflicts with master — and
      # a conflicting PR is exactly what this job must be able to repair.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Resolve PR head
        id: pr
        run: |
          # shellcheck disable=SC1091
          source scripts/ci/swarm-lib.sh
          swarm_stage_lib
          PR='${{ github.event.pull_request.number || inputs.number }}'
          HEAD_REF=$(gh pr view "$PR" --json headRefName --jq .headRefName)
          echo "number=$PR" >>"$GITHUB_OUTPUT"
          echo "head=$HEAD_REF" >>"$GITHUB_OUTPUT"
      # fetch-depth 0 so the master merge below has a real merge base.
      - uses: actions/checkout@v6
        with:
          repository: ${{ github.repository }}
          ref: refs/pull/${{ steps.pr.outputs.number }}/head
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      - uses: ./.github/actions/setup-opencode
      - name: Fix and push to the same branch
        run: |
          # shellcheck disable=SC1091
          # ALWAYS source the pinned lib: the PR head checkout below has
          # overwritten the workspace and its swarm-lib.sh may predate the
          # helpers this workflow calls (they were "command not found").
          source "$RUNNER_TEMP/swarm-lib.sh"
          PR='${{ steps.pr.outputs.number }}'
          HEAD_REF='${{ steps.pr.outputs.head }}'
          swarm_require_auth
          # Lost race for the lock: exit green — the holder does the work.
          # (A lock with no live run behind it is cleared by the stale-lock sweep.)
          swarm_acquire_lock pr "$PR" || { echo 'lock held by another runner; exiting green'; exit 0; }
          swarm_auto_release pr "$PR"
          FAILS=$(swarm_fail_count "$PR")
          # MAX_ROUNDS=0 means unlimited: keep fixing until green. A nonzero
          # value re-enables the old cap as an escape hatch.
          if [ "${MAX_ROUNDS:-0}" != 0 ] && [ "$FAILS" -ge "${MAX_ROUNDS:-0}" ]; then
            swarm_remove_label pr "$PR" ai:changes
            swarm_add_label pr "$PR" ai:blocked
            swarm_say pr "$PR" "Agent flow (CI): exceeded $FAILS/$MAX_ROUNDS review/fix rounds. Needs human attention."
            exit 1
          fi
          git config user.name 'MES Agent Swarm'
          git config user.email 'mes-swarm@users.noreply.github.com'
          swarm_use_pat_remote "${{ secrets.SWARM_PAT }}"
          git checkout -B "$HEAD_REF"
          # Bring the branch up to date with master FIRST: feedback fixes on a
          # stale branch die at merge time. Conflicts become part of the agent's
          # task below (with a strict resolution contract).
          CONFLICT_NOTE=''
          MERGE_RC=0
          swarm_sync_master || MERGE_RC=$?
          if [ "$MERGE_RC" = 2 ]; then
            CONFLICT_NOTE="$(swarm_conflict_rules)"
          fi
          # No-progress fingerprint, taken AFTER the master sync so only the
          # agent's own work counts. A round that changes neither the code nor
          # the PR description cannot change a verdict, and re-firing the gates
          # would judge the identical diff again (see the no-progress exit below).
          HEAD_BEFORE=$(swarm_remote_head_sha "$PR" || true)
          BODY_BEFORE=$(swarm_pr_body_hash "$PR" || true)
          # CI has no session affinity (unlike the local dispatcher): the fix
          # prompt points at the PR comments so a fresh session can continue.
          # Do NOT let the agent boot the app or a database — that burned whole
          # sessions (CORS/env rabbit holes) and starved the actual fixes.
          swarm_run_agent mes-implementer \
            "Review/e2e feedback on PR #$PR requested changes. Read it with 'gh pr view $PR --comments'. Fix every point, re-run 'dotnet build AsistOff.MES.sln', 'dotnet test tests/AsistOff.MES.Shared.Tests' and 'npm --prefix AsistOff.MES.Web run build', then push to the same branch and reply. Do NOT run tests/AsistOff.MES.Integration.Tests. Never commit merge-conflict markers. Do not start the application, any database or docker — CI runs integration tests; e2e is a later stage. $CONFLICT_NOTE Do not add or remove ai:* labels." \
            fix.log
          if ! swarm_finish_merge_if_pending; then
            swarm_remove_label pr "$PR" ai:changes
            swarm_add_label pr "$PR" ai:blocked
            swarm_say pr "$PR" 'Agent flow (CI): the master merge still has unresolved conflicts after the fix round. Needs human attention.'
            exit 1
          fi
          if ! swarm_check_conflict_markers; then
            swarm_run_agent mes-implementer \
              'Remove every merge-conflict marker from the working tree (they were committed by mistake). Resolve each file to the correct final content — union both sides for i18n.ts/sitemap.ts/ApiContracts.cs — then run the builds and push.' \
              fix-markers.log
            if ! swarm_check_conflict_markers; then
              swarm_remove_label pr "$PR" ai:changes
              swarm_add_label pr "$PR" ai:blocked
              swarm_say pr "$PR" 'Agent flow (CI): conflict markers survived the cleanup round. Needs human attention.'
              exit 1
            fi
          fi
          if ! git push origin "$HEAD_REF"; then
            echo 'push rejected (history was rewritten?) — retrying with --force-with-lease'
            if ! git push --force-with-lease origin "$HEAD_REF"; then
              swarm_remove_label pr "$PR" ai:changes
              swarm_add_label pr "$PR" ai:blocked
              swarm_say pr "$PR" 'Agent flow (CI): could not push the fix to the PR branch. Needs human attention.'
              exit 1
            fi
          fi
          # No-progress exit: the gate passes are idempotent per head SHA, so
          # re-firing them on an unchanged diff can only reproduce the verdict
          # we just got. Escalate instead of looping (MAX_ROUNDS=0 is unlimited).
          if swarm_fix_made_no_progress "$PR" "$HEAD_BEFORE" "$BODY_BEFORE"; then
            swarm_remove_label pr "$PR" ai:changes
            swarm_add_label pr "$PR" ai:blocked
            swarm_say pr "$PR" 'Agent flow (CI): the fix round changed neither the code nor the PR description, so another review/verify round would judge the identical diff. Needs human attention.'
            exit 1
          fi
          swarm_remove_label pr "$PR" ai:changes
          swarm_open_gates "$PR"
          echo 'gates reopened'

  # ------------------------------------------------------------------------ e2e
  e2e:
    name: e2e smoke PR
    if: >
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.draft == false &&
      github.event.label.name == 'ai:e2e' ||
      github.event_name == 'workflow_dispatch' &&
      inputs.agent == 'mes-e2e-tester'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mes
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: root
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d mes"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      postgres__connectionString: 'Host=localhost;Port=5432;Database=mes;Username=admin;Password=root'
      VITE_API_BASE_URL: 'http://localhost:5243/'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Resolve PR number
        id: pr
        run: |
          # shellcheck disable=SC1091
          source scripts/ci/swarm-lib.sh
          swarm_stage_lib
          PR='${{ github.event.pull_request.number || inputs.number }}'
          echo "number=$PR" >>"$GITHUB_OUTPUT"
          if [ "$(swarm_pr_mergeable "$PR")" = CONFLICTING ]; then
            swarm_remove_label pr "$PR" ai:e2e
            swarm_refire_label pr "$PR" ai:changes
            swarm_say pr "$PR" 'Agent flow (CI): the PR conflicts with master — back to ai:changes so the fixer can rebase and resolve.'
            echo "skip=true" >>"$GITHUB_OUTPUT"
          elif swarm_verdict_covers_head "$PR" e2e E2E_PASS; then
            echo 'E2E_PASS already covers this head SHA; skipping smoke'
            swarm_remove_label pr "$PR" ai:e2e
            swarm_add_label pr "$PR" ai:ready
            swarm_say pr "$PR" 'Agent flow (CI): e2e already passed for this head SHA. Auto-merge will take it from here (ai:ready).'
            echo "skip=true" >>"$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v6
        if: steps.pr.outputs.skip != 'true'
        with:
          repository: ${{ github.repository }}
          ref: refs/pull/${{ steps.pr.outputs.number }}/merge
      - uses: actions/setup-dotnet@v5
        if: steps.pr.outputs.skip != 'true'
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v6
        if: steps.pr.outputs.skip != 'true'
        with:
          node-version: 20
      - uses: ./.github/actions/setup-opencode
        if: steps.pr.outputs.skip != 'true'
      - name: Cache NuGet packages
        if: steps.pr.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Install Playwright browsers
        if: steps.pr.outputs.skip != 'true'
        run: |
          npm --prefix AsistOff.MES.Web ci
          npx --yes playwright@latest install --with-deps chromium
      - name: Run Playwright smoke via agent
        if: steps.pr.outputs.skip != 'true'
        run: |
          # shellcheck disable=SC1091
          source "$RUNNER_TEMP/swarm-lib.sh"
          PR='${{ steps.pr.outputs.number }}'
          swarm_require_auth
          # Lost race for the lock: exit green — the holder does the work.
          # (A lock with no live run behind it is cleared by the stale-lock sweep.)
          swarm_acquire_lock pr "$PR" || { echo 'lock held by another runner; exiting green'; exit 0; }
          swarm_auto_release pr "$PR"
          if swarm_verdict_covers_head "$PR" e2e E2E_PASS; then
            echo 'E2E_PASS already covers this head SHA; skipping smoke'
            swarm_remove_label pr "$PR" ai:e2e
            swarm_add_label pr "$PR" ai:ready
            swarm_say pr "$PR" 'Agent flow (CI): e2e already passed for this head SHA. Auto-merge will take it from here (ai:ready).'
            exit 0
          fi
          SHA=$(gh pr view "$PR" --json headRefOid --jq .headRefOid)
          # Start the stack with nohup in THIS step: app.ps1 background jobs
          # are killed when their launcher returns on CI runners. The service
          # above only provides PostgreSQL on localhost:5432.
          nohup dotnet run --project AsistOff.MES.Gateway > /tmp/backend.log 2>&1 &
          echo $! > /tmp/backend.pid
          (cd AsistOff.MES.Web && nohup npm run dev > /tmp/frontend.log 2>&1 & echo $! > /tmp/frontend.pid)
          for i in $(seq 1 60); do
            BACKEND_OK=$(curl -sf http://localhost:5243/health >/dev/null 2>&1 && echo 1 || echo 0)
            FRONTEND_OK=$(curl -sf http://localhost:5173 >/dev/null 2>&1 && echo 1 || echo 0)
            if [ "$BACKEND_OK" = 1 ] && [ "$FRONTEND_OK" = 1 ]; then
              echo "stack healthy (backend + frontend)"
              break
            fi
            if [ "$i" = 60 ]; then
              echo "stack failed to become healthy; backend log:"
              tail -30 /tmp/backend.log || true
              echo "frontend log:"
              tail -30 /tmp/frontend.log || true
            fi
            sleep 2
          done
          # The stack is already running — tell the agent to use it as-is.
          swarm_run_agent mes-e2e-tester \
            "Run the Playwright end-to-end smoke test for PR #$PR. The stack is ALREADY RUNNING at http://localhost:5243 (backend) and http://localhost:5173 (frontend). Do NOT start or stop the stack. Resolve the scope from 'gh pr diff $PR --name-only' using the mes-e2e skill, then post the result with 'gh pr comment $PR' ending with exactly one line on its own: 'VERDICT: E2E_PASS', 'VERDICT: E2E_FAIL' or 'VERDICT: E2E_BLOCKED'. Do not write any other VERDICT line. Do not add or remove ai:* labels." \
            e2e.log
          VERDICT=$(swarm_verdict 'E2E_PASS|E2E_FAIL|E2E_BLOCKED' e2e.log)
          if [ "$VERDICT" = UNKNOWN ] || [ "$VERDICT" = AMBIGUOUS ]; then
            VERDICT=$(swarm_comments_body pr "$PR" | swarm_last_verdict_stdin 'E2E_PASS|E2E_FAIL|E2E_BLOCKED')
          fi
          case "$VERDICT" in
            E2E_PASS | E2E_FAIL | E2E_BLOCKED) swarm_mark_verdict "$PR" e2e "$SHA" "$VERDICT" || true ;;
          esac
          swarm_remove_label pr "$PR" ai:e2e
          case "$VERDICT" in
            E2E_PASS)
              swarm_add_label pr "$PR" ai:ready
              swarm_say pr "$PR" 'Agent flow (CI): CI + review + verify + e2e green. Auto-merge will take it from here (ai:ready).'
              ;;
            E2E_FAIL) swarm_refire_label pr "$PR" ai:changes; echo '-> ai:changes' ;;
            E2E_BLOCKED)
              # Infrastructure problem (stack/DB/browser), not a code failure:
              # review + verify already passed — promote instead of stalling.
              swarm_add_label pr "$PR" ai:ready
              swarm_say pr "$PR" 'Agent flow (CI): e2e smoke could not complete (infrastructure). Review + verify passed — promoting to ai:ready. Re-run e2e manually if needed.'
              ;;
            *)
              swarm_add_label pr "$PR" ai:blocked
              swarm_say pr "$PR" 'Agent flow (CI): e2e produced no verdict at all. Needs human attention.'
              exit 1
              ;;
          esac
      - name: Stop e2e stack
        if: always()
        run: |
          kill "$(cat /tmp/backend.pid 2>/dev/null)" 2>/dev/null || true
          kill "$(cat /tmp/frontend.pid 2>/dev/null)" 2>/dev/null || true
          pkill -f 'dotnet.*AsistOff.MES.Gateway' 2>/dev/null || true
          pkill -f 'npm run dev' 2>/dev/null || true

  # ----------------------------------------------------------------- researcher
  researcher:
    name: researcher (weekly gaps)
    if: >
      github.event_name == 'schedule' &&
      github.event.schedule == '0 6 * * 1' ||
      github.event_name == 'workflow_dispatch' &&
      inputs.agent == 'mes-researcher'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: ./.github/actions/setup-opencode
      - name: Append gap rows and open PR
        run: |
          # shellcheck disable=SC1091
          source scripts/ci/swarm-lib.sh
          swarm_require_auth
          git config user.name 'MES Agent Swarm'
          git config user.email 'mes-swarm@users.noreply.github.com'
          swarm_use_pat_remote "${{ secrets.SWARM_PAT }}"
          swarm_run_agent mes-researcher \
            'Read docs/feature-tracker.md first (do NOT rescan the whole repo). Append 1-3 new gap rows in the correct section (Status=gap, Work item=-, dependencies in Notes prefixed "depends on"). Never create GitHub issues and never modify existing rows.' \
            researcher.log
          if git diff --quiet -- docs/feature-tracker.md; then
            echo 'No new gaps; nothing to do.'
            exit 0
          fi
          BRANCH="ai/research-$(date -u +%Y%m%d)"
          git checkout -B "$BRANCH"
          git add docs/feature-tracker.md
          git commit -m 'docs: researcher gap rows'
          git push -u origin "$BRANCH"
          if ! gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number' | grep -q .; then
            gh pr create --title 'docs: researcher gap rows' --body 'Weekly mes-researcher run. Review fast-path auto-merges docs-only PRs; mes-analyst turns gaps into ai:implement issues.'
          fi
          swarm_label_docs_pr "$BRANCH"

  # -------------------------------------------------------------------- tracker
  tracker:
    name: tracker sync (daily)
    if: >
      github.event_name == 'schedule' &&
      github.event.schedule == '30 5 * * *' ||
      github.event_name == 'workflow_dispatch' &&
      inputs.agent == 'mes-tracker'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: ./.github/actions/setup-opencode
      - name: Reconcile feature tracker
        run: |
          # shellcheck disable=SC1091
          source scripts/ci/swarm-lib.sh
          swarm_require_auth
          git config user.name 'MES Agent Swarm'
          git config user.email 'mes-swarm@users.noreply.github.com'
          swarm_use_pat_remote "${{ secrets.SWARM_PAT }}"
          DEFAULT=$(swarm_default_branch)
          swarm_run_agent mes-tracker \
            "Reconcile docs/feature-tracker.md with GitHub issues/PRs and the codebase, then publish the update on branch ai/tracker-sync (based on $DEFAULT) and open or update a PR. Abort if the working tree is dirty." \
            tracker.log
          swarm_label_docs_pr ai/tracker-sync

  # ---------------------------------------------------------------------- sweep
  sweep:
    name: sweep queued issues
    # Wakes up on every merge (push) and every 30 min. Re-fires the labeled
    # event for the oldest queued issue when a parallel slot is free, so work
    # refused by the MAX_PARALLEL gate retries instead of stalling.
    if: >
      github.event_name == 'schedule' &&
      github.event.schedule == '*/30 * * * *' ||
      github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Re-fire oldest queued issue when a slot is free
        run: |
          # shellcheck disable=SC1091
          source scripts/ci/swarm-lib.sh
          # Always clean stale locks first — a lost job must not block a slot.
          swarm_cleanup_stale_locks
          # Heal stage PRs whose retrigger event never fired (bot-actor runs
          # emit no workflow_run) — re-fires ai:review/verify/e2e/ready/changes labels.
          swarm_nudge_stuck_prs
          if [ "$(swarm_in_flight_count)" -ge "${MAX_PARALLEL:-3}" ]; then
            echo "at capacity; nothing to sweep"
            exit 0
          fi
          # Migration serialization: two parallel EF-migration PRs zipper-merge
          # into DefaultContextModelSnapshot.cs and corrupt master. One at a time.
          MIG_PR=$(swarm_in_flight_migration_pr)
          if [ -n "$MIG_PR" ]; then
            echo "migration PR #$MIG_PR in flight; waiting before starting new work"
            exit 0
          fi
          ISSUE=$(swarm_oldest_queued_issue)
          if [ -z "$ISSUE" ]; then
            echo 'queue empty; nothing to sweep'
            exit 0
          fi
          swarm_remove_label issue "$ISSUE" ai:implement
          swarm_add_label issue "$ISSUE" ai:implement
          echo "re-fired ai:implement on issue #$ISSUE"

  # ---------------------------------------------------------------------- merge
  merge:
    name: auto-merge ready PR
    if: >
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.draft == false &&
      github.event.label.name == 'ai:ready'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Merge when CI is green
        run: |
          # shellcheck disable=SC1091
          source scripts/ci/swarm-lib.sh
          PR='${{ github.event.pull_request.number }}'
          # Merge does not run an agent. Do not require OPENCODE_API_KEY.
          swarm_acquire_lock pr "$PR" || { echo 'lock held by another runner; exiting green'; exit 0; }
          swarm_auto_release pr "$PR"
          CI=$(swarm_wait_ci "$PR" 600 | tail -n 1)
          echo "ci=$CI"
          case "$CI" in
            pass) ;;
            fail)
              swarm_remove_label pr "$PR" ai:ready
              swarm_refire_label pr "$PR" ai:changes
              swarm_say pr "$PR" 'Agent flow (CI): ai:ready but CI is red — back to ai:changes for a fix, not a re-review.'
              exit 0
              ;;
            approval)
              swarm_block_for_approval "$PR" ai:ready
              exit 0
              ;;
            timeout)
              swarm_say pr "$PR" 'Agent flow (CI): CI still pending at merge time. Keeping ai:ready; the ci-completed event will retry. Not re-reviewing.'
              exit 0
              ;;
            *)
              swarm_remove_label pr "$PR" ai:ready
              swarm_add_label pr "$PR" ai:blocked
              swarm_say pr "$PR" "Agent flow (CI): unexpected CI state '$CI' at merge. Needs human attention."
              exit 1
              ;;
          esac
          if gh pr merge "$PR" --squash --delete-branch; then
            swarm_say pr "$PR" 'Agent flow (CI): merged to the default branch (squash).'
          else
            swarm_remove_label pr "$PR" ai:ready
            if [ "$(swarm_pr_mergeable "$PR")" = CONFLICTING ]; then
              swarm_refire_label pr "$PR" ai:changes
              swarm_say pr "$PR" 'Agent flow (CI): auto-merge hit a conflict with master — back to ai:changes so the fixer can rebase and resolve.'
            else
              swarm_add_label pr "$PR" ai:blocked
              swarm_say pr "$PR" 'Agent flow (CI): auto-merge failed (not a conflict — see the run log). Needs human attention.'
            fi
            exit 1
          fi

  # -------------------------------------------------------------------- analyst
  analyst:
    name: analyst (queue refill)
    # Same wake-ups as sweep. Keeps QUEUE_TARGET unblocked ai:implement issues
    # ready so the line does not go idle between slices. Exits green without an
    # agent session when the queue is warm, the backlog is full, or nothing is actionable.
    if: >
      github.event_name == 'schedule' &&
      github.event.schedule == '*/30 * * * *' ||
      github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: ai-swarm-analyst
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: ./.github/actions/setup-opencode
      - name: Spec next work when the queue is thin
        run: |
          # shellcheck disable=SC1091
          source scripts/ci/swarm-lib.sh
          QUEUED=$(swarm_queued_count)
          if [ "$QUEUED" -ge "${QUEUE_TARGET:-2}" ]; then
            echo "implement queue has $QUEUED >= target; nothing to spec"
            exit 0
          fi
          # The cap only limits NET-NEW work the analyst would create from a
          # tracker gap. Adopting an existing unlabeled proposal is always
          # allowed — those proposals COUNT toward the backlog, so gating on it
          # deadlocks refill once the orphans reach BACKLOG_MAX.
          if [ "$(swarm_unlabeled_count)" -eq 0 ] && [ "$(swarm_backlog_count)" -ge "${BACKLOG_MAX:-5}" ]; then
            echo 'backlog full; nothing to spec'
            exit 0
          fi
          if ! swarm_has_actionable_gap; then
            echo 'no unlabeled proposals and no tracker gap rows; queue truly done'
            exit 0
          fi
          swarm_require_auth
          swarm_run_agent mes-analyst \
            "The implement queue has fewer than ${QUEUE_TARGET:-2} unblocked ai:implement issues. Adopt the oldest unlabeled open proposal or spec the next actionable tracker gap (slice subsystem-sized gaps per the Sizing section of the mes-issue-spec skill). Create the issue(s) with gh issue create and add ai:implement to every unblocked slice until ${QUEUE_TARGET:-2} issues hold ai:implement, or you run out of unblocked work. Do not label a slice whose dependency is still open." \
            analyst.log
