# Local development only (same model as the asiki project).
# `docker compose up` loads this file automatically on top of
# docker-compose.yml, exposing the stack on the host:
#   web frontend -> http://localhost:3000 (or $HTTP_PORT)
#   api          -> http://localhost:8080
#   postgres     -> localhost:5432
#   seq UI       -> http://localhost:5341 (or $SEQ_PORT)
# Coolify runs compose with an explicit `-f docker-compose.yml` and IGNORES
# this file, so the server never publishes host ports (traffic enters only
# through the Coolify proxy -> web:8080).
services:
  postgres:
    ports:
      - "5432:5432"

  seq:
    ports:
      # Seq serves both the web UI and the ingestion API on a single HTTP
      # port (80 inside the container).
      - "${SEQ_PORT:-5341}:80"

  api:
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Boot__ApplyMigrations: "true"
      Boot__RunSeeders: "true"
    ports:
      - "8080:8080"

  web:
    ports:
      - "${HTTP_PORT:-3000}:8080"

  api-prod:
    ports:
      - "8081:8080"
