server {
    # Unprivileged port (issue #271): the runtime stage runs as the non-root
    # `nginx` user, which cannot bind port 80. Compose maps 3000:8080.
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Rendered at container start by docker-entrypoint.sh from $API_BASE_URL
    # (issue #271) — never cache it, so repointing the backend only needs a
    # container restart, not a rebuild.
    location = /config.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Handle SPA client-side routing – never cache the HTML shell
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively (content-hashed filenames)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}
