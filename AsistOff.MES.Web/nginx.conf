# Single public entrypoint (deployment on Coolify, same as asiki): only this
# frontend container gets a public domain. /api/* and the infrastructure
# endpoints are proxied to the api container over the compose network, so
# browsers stay same-origin (no CORS, Secure cookies just work).
# Keep the scheme of the original request when behind the Coolify/Traefik proxy.
map $http_x_forwarded_proto $upstream_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    # Unprivileged port (issue #271): the runtime stage runs as the non-root
    # `nginx` user, which cannot bind port 80. In Coolify point the domain
    # at the `web` service, port 8080. Locally compose maps 3000:8080
    # (see docker-compose.override.yml).
    # Dual-stack: plain `listen 8080` binds IPv4 only, but musl resolves
    # `localhost` to ::1 first — the wget healthcheck then gets connection
    # refused and Coolify marks the app Degraded (no Traefik route).
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Attachments accept up to 100 MB (RequestSizeLimit on AttachmentsController).
    client_max_body_size 100m;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $upstream_proto;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Container-orchestrator probes (anonymous, no tenant context).
    location /health {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $upstream_proto;
    }

    # Swagger UI + OpenAPI json (Development only, harmless in Production).
    location /swagger {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $upstream_proto;
    }

    # Rendered at container start by docker-entrypoint.sh from $API_BASE_URL
    # (issue #271) — never cache it, so repointing the backend only needs a
    # container restart, not a rebuild.
    location = /config.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Handle SPA client-side routing – never cache the HTML shell
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively (content-hashed filenames)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}
