# Single public entrypoint (deployment on Coolify, same as asiki): only this
# frontend container gets a public domain. /api/* and the infrastructure
# endpoints are proxied to the api container over the compose network, so
# browsers stay same-origin (no CORS, Secure cookies just work).
# Keep the scheme of the original request when behind the Coolify/Traefik proxy.
map $http_x_forwarded_proto $upstream_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    # Unprivileged port (issue #271): the runtime stage runs as the non-root
    # `nginx` user, which cannot bind port 80. In Coolify point the domain
    # at the `web` service, port 8080. Locally compose maps 3000:8080
    # (see docker-compose.override.yml).
    # Dual-stack: plain `listen 8080` binds IPv4 only, but musl resolves
    # `localhost` to ::1 first — the wget healthcheck then gets connection
    # refused and Coolify marks the app Degraded (no Traefik route).
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Attachments edge limit (issue #348): app cap (10 MiB) + multipart margin
    # (1 MiB) = 11 MiB RequestSizeLimit on AttachmentsController. nginx allows
    # a touch more (12m) so Kestrel — which returns the precise 400/413 —
    # stays the enforcer; keep this aligned with Attachments:Upload when the
    # app cap changes.
    client_max_body_size 12m;

    # SPA security headers (issue #340): the Gateway's
    # SecurityHeadersMiddleware only covers /api/* (proxied below), so every
    # nginx-terminated response (index.html shell, hashed assets, config.js,
    # SPA fallback) must carry the same conservative set here. Each static
    # location below repeats the four headers with the `always` parameter so
    # error responses (e.g. 404 when index.html is missing) carry them too.
    # The /api/, /health and /swagger proxy locations deliberately define NO
    # add_header directives: nginx would otherwise append these next to the
    # backend values and clients would see duplicated X-Content-Type-Options /
    # CSP headers. Keep the three static blocks in sync when changing values.
    #
    # CSP starts from the backend default (default-src 'self'; base-uri
    # 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self')
    # with the Vite-SPA deltas the issue prescribes: frame-ancestors 'self'
    # (X-Frame-Options DENY below still forbids all framing for legacy
    # browsers), script-src / style-src / img-src / font-src / connect-src
    # 'self' for the external hashed bundle, same-origin API calls and data:
    # images/fonts (inlined SVG icons, PrimeIcons woff2). One documented
    # widening: style-src additionally allows 'unsafe-inline' because Vue 3
    # renders dynamic :style bindings (Dashboard KPI icons, Gantt bars,
    # progress bars, AppTable column widths) and transitions as inline
    # style="" attributes, which CSP Level 3 governs under style-src —
    # without it the shell boots but logs a violation per dynamic style.
    # script-src stays 'self' with no 'unsafe-inline'/eval: SFC templates are
    # precompiled and the production bundle has no inline scripts.
    #
    # No HSTS here by design: TLS terminates at the Coolify/Traefik proxy and
    # this server only speaks plain HTTP to it; the Gateway still emits HSTS
    # for https /api responses.

    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $upstream_proto;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Container-orchestrator probes (anonymous, no tenant context).
    location /health {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $upstream_proto;
    }

    # Swagger UI + OpenAPI json (Development only, harmless in Production).
    location /swagger {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $upstream_proto;
    }

    # Rendered at container start by docker-entrypoint.sh from $API_BASE_URL
    # (issue #271) — never cache it, so repointing the backend only needs a
    # container restart, not a rebuild.
    location = /config.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'" always;
    }

    # Handle SPA client-side routing – never cache the HTML shell
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'" always;
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively (content-hashed filenames)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'" always;
        access_log off;
    }
}
