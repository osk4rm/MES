# Hardened runtime defaults (issue #271):
# - every image is pinned by digest (refresh with `docker build` + `docker inspect --format '{{.RepoDigests}}'`)
# - every long-lived service declares `restart:` plus memory/cpu `deploy.resources.limits`
# - no weak default secrets: POSTGRES_PASSWORD and AUTH_ISSUER_SIGNING_KEY have
#   NO fallback value (`${VAR:?message}` fails fast with a generation hint);
#   create them with `cp .env.example .env && sh scripts/generate-env.sh`
services:
  postgres:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mes}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required - copy .env.example to .env and run sh scripts/generate-env.sh}"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  seq:
    image: datalust/seq:2024.3@sha256:a9d266df8cbbfd3735e85d39f5fda7cd3d7cbbb2b653b6d39403597da16a17b1
    environment:
      ACCEPT_EULA: "Y"
    ports:
      # Seq serves both the web UI and the ingestion API on a single HTTP
      # port (80 inside the container). Open http://localhost:5341 in the
      # browser to view logs; the API ships logs to the same endpoint.
      - "${SEQ_PORT:-5341}:80"
    volumes:
      - seq_data:/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required - copy .env.example to .env and run sh scripts/generate-env.sh}"
      postgres__connectionString: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-mes};Username=${POSTGRES_USER:-admin};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required - copy .env.example to .env and run sh scripts/generate-env.sh}"
      # Optional signing-key override for local docker runs; when empty the
      # Development appsettings placeholder applies (production services below
      # REQUIRE the generated key instead).
      auth__IssuerSigningKey: "${AUTH_ISSUER_SIGNING_KEY:-}"
      # Override the Seq sink server URL so logs ship to the seq container
      # over the docker network. Configuration array elements are addressable
      # via __<index>__ — index 1 is the "Seq" sink in appsettings.json.
      Serilog__WriteTo__1__Args__serverUrl: "http://seq:80"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      seq:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: on-failure
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

  web:
    build:
      context: ./AsistOff.MES.Web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: "${VITE_API_BASE_URL:-http://localhost:8080}"
    environment:
      # Runtime backend URL (issue #271): the entrypoint renders this to
      # /config.js at container start; the bundle prefers it over the
      # build-time VITE_API_BASE_URL above. Must be reachable from the
      # operator's browser, not from inside Docker.
      API_BASE_URL: "${API_BASE_URL:-http://localhost:8080}"
    ports:
      - "3000:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/ || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

  # Production schema upgrades (issue #257). One-shot job that applies all
  # pending EF Core migrations (plus seeders when Boot__RunSeeders=true) and
  # then exits. Run standalone (`docker compose --profile migrate run --rm
  # migrate`) or as part of the production profile, where api-prod waits for
  # it via service_completed_successfully before serving traffic.
  migrate:
    profiles: ["migrate", "production"]
    build:
      context: .
      dockerfile: Dockerfile
    command: ["--migrate-only"]
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required - copy .env.example to .env and run sh scripts/generate-env.sh}"
      postgres__connectionString: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-mes};Username=${POSTGRES_USER:-admin};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required - copy .env.example to .env and run sh scripts/generate-env.sh}"
      auth__IssuerSigningKey: "${AUTH_ISSUER_SIGNING_KEY:?AUTH_ISSUER_SIGNING_KEY is required - copy .env.example to .env and run sh scripts/generate-env.sh}"
      Boot__ApplyMigrations: "true"
      Boot__RunSeeders: "${BOOT_RUN_SEEDERS:-false}"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Production gateway: never migrates or seeds on boot (Boot defaults are
  # false and appsettings.Production.json pins them). The schema is upgraded
  # by the migrate job above, which must complete successfully first.
  api-prod:
    profiles: ["production"]
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required - copy .env.example to .env and run sh scripts/generate-env.sh}"
      postgres__connectionString: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-mes};Username=${POSTGRES_USER:-admin};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required - copy .env.example to .env and run sh scripts/generate-env.sh}"
      auth__IssuerSigningKey: "${AUTH_ISSUER_SIGNING_KEY:?AUTH_ISSUER_SIGNING_KEY is required - copy .env.example to .env and run sh scripts/generate-env.sh}"
      Boot__ApplyMigrations: "false"
      Boot__RunSeeders: "false"
      Serilog__WriteTo__1__Args__serverUrl: "http://seq:80"
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      seq:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: on-failure
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

  # Nightly pg_dump backup example (issue #257). Loops forever: writes a
  # timestamped dump to the pg_backups volume, prunes beyond
  # BACKUP_RETENTION_COUNT, sleeps BACKUP_INTERVAL_SECONDS (86400 = nightly).
  # Included in the production profile; also runnable standalone with
  # `docker compose --profile backup up backup`.
  backup:
    profiles: ["production", "backup"]
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-mes}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      PGPASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required - copy .env.example to .env and run sh scripts/generate-env.sh}"
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_COUNT: ${BACKUP_RETENTION_COUNT:-7}
    volumes:
      - ./docker/backup/backup.sh:/backup.sh:ro
      - pg_backups:/backups
    command: ["sh", "/backup.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M

  # Agent swarm: dashboard + dispatcher, always on, working on an isolated
  # clone of the repo (named volume `swarm_work`). Starts with the stack
  # (`docker compose up -d`) and survives reboots (`restart: unless-stopped`).
  # Needs GH_TOKEN in `.env`. Start alone with: docker compose up -d swarm
  swarm:
    build:
      context: ./docker/swarm
      dockerfile: Dockerfile
    environment:
      TEMP: /tmp
      TMPDIR: /tmp
      DASHBOARD_PORT: "5178"
      REPO_URL: "${SWARM_REPO_URL:-https://github.com/osk4rm/MES.git}"
      REPO_BRANCH: "${SWARM_REPO_BRANCH:-master}"
      GH_TOKEN: "${GH_TOKEN:-}"
      SWARM_AUTOSTART_DISPATCHER: "${SWARM_AUTOSTART_DISPATCHER:-1}"
      # So the e2e agent's `dotnet run` inside the container reaches the
      # compose PostgreSQL instead of localhost.
      ASPNETCORE_ENVIRONMENT: Development
      postgres__connectionString: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-mes};Username=${POSTGRES_USER:-admin};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required - copy .env.example to .env and run sh scripts/generate-env.sh}"
      # Testcontainers (integration tests) talk to the host Docker daemon.
      DOCKER_HOST: "unix:///var/run/docker.sock"
      TESTCONTAINERS_HOST_OVERRIDE: "host.docker.internal"
    ports:
      - "${DASHBOARD_PORT:-5178}:5178"
    volumes:
      - swarm_work:/work
      # opencode config + auth from the host (no spaces in these paths).
      - type: bind
        source: "${USERPROFILE}/.config/opencode"
        target: /root/.config/opencode
      - type: bind
        source: "${USERPROFILE}/.local/share/opencode"
        target: /root/.local/share/opencode
      # Docker socket for Testcontainers.
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G

volumes:
  postgres_data:
  pg_backups:
  seq_data:
  swarm_work:
